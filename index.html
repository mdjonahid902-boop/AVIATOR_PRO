<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red vs Blue - Demo Spin</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#080b12;
  color:white;
  font-family:Arial,sans-serif;
}

.container{
  width:min(92%,420px);
  text-align:center;
}

h1{
  margin-bottom:8px;
}

.subtitle{
  color:#9da5b5;
  margin-bottom:20px;
}

.coin-box{
  background:#111827;
  border:1px solid #263044;
  border-radius:15px;
  padding:12px;
  margin-bottom:20px;
  font-size:18px;
}

#coins{
  color:#ffd43b;
  font-weight:bold;
}

/* Wheel */
.wheel-area{
  position:relative;
  width:280px;
  height:280px;
  margin:25px auto;
}

.pointer{
  position:absolute;
  top:-15px;
  left:50%;
  transform:translateX(-50%);
  z-index:5;

  width:0;
  height:0;
  border-left:15px solid transparent;
  border-right:15px solid transparent;
  border-top:32px solid #fff;

  filter:drop-shadow(0 2px 4px #000);
}

.wheel{
  width:280px;
  height:280px;
  border-radius:50%;

  background:conic-gradient(
    #e63946 0deg 180deg,
    #1769e0 180deg 360deg
  );

  border:8px solid #252c3b;
  box-shadow:
    0 0 0 4px #111827,
    0 0 35px rgba(255,255,255,.12);

  transition:transform 4s cubic-bezier(.12,.75,.18,1);
}

.wheel::after{
  content:"";
  position:absolute;
  width:65px;
  height:65px;
  background:#111827;
  border:5px solid #fff;
  border-radius:50%;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}

.bet-title{
  margin-top:20px;
  color:#cbd5e1;
}

.buttons{
  display:flex;
  gap:12px;
  justify-content:center;
  margin:15px 0;
}

.bet-btn{
  flex:1;
  max-width:150px;
  padding:13px;
  border:0;
  border-radius:10px;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.red{
  background:#e63946;
}

.blue{
  background:#1769e0;
}

.selected{
  outline:3px solid #fff;
  transform:scale(1.03);
}

.amount-box{
  display:flex;
  gap:8px;
  justify-content:center;
  margin:15px 0;
}

.amount-box input{
  width:150px;
  padding:12px;
  border:1px solid #334155;
  border-radius:8px;
  background:#0f172a;
  color:white;
  font-size:16px;
  text-align:center;
}

#spinBtn{
  width:100%;
  padding:15px;
  border:0;
  border-radius:11px;
  background:linear-gradient(90deg,#ffcc00,#ff6600);
  color:#111;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

#spinBtn:disabled{
  opacity:.5;
}

#result{
  min-height:30px;
  margin-top:18px;
  font-size:20px;
  font-weight:bold;
}

.note{
  margin-top:15px;
  color:#7f8a9d;
  font-size:12px;
}
</style>
</head>

<body>

<div class="container">

  <h1>🔴 Red vs 🔵 Blue</h1>
  <div class="subtitle">Demo Spin Game</div>

  <div class="coin-box">
    🪙 Demo Coins:
    <span id="coins">1000</span>
  </div>

  <div class="wheel-area">
    <div class="pointer"></div>
    <div id="wheel" class="wheel"></div>
  </div>

  <div class="bet-title">
    তোমার কালার নির্বাচন করো
  </div>

  <div class="buttons">
    <button class="bet-btn red" onclick="selectColor('red')">
      🔴 RED
    </button>

    <button class="bet-btn blue" onclick="selectColor('blue')">
      🔵 BLUE
    </button>
  </div>

  <div class="amount-box">
    <input
      id="amount"
      type="number"
      min="1"
      value="50"
      placeholder="Demo Coin"
    >
  </div>

  <button id="spinBtn" onclick="spin()">
    🎯 SPIN
  </button>

  <div id="result"></div>

  <div class="note">
    এটি শুধুমাত্র শেখার জন্য একটি Demo — আসল টাকা ব্যবহার করে না।
  </div>

</div>

<script>

let coins = 1000;
let selectedColor = null;
let rotation = 0;
let spinning = false;

const wheel = document.getElementById("wheel");
const result = document.getElementById("result");
const coinsText = document.getElementById("coins");
const spinBtn = document.getElementById("spinBtn");

function selectColor(color){

  selectedColor = color;

  document.querySelectorAll(".bet-btn")
    .forEach(btn => btn.classList.remove("selected"));

  if(color === "red"){
    document.querySelector(".red")
      .classList.add("selected");
  }else{
    document.querySelector(".blue")
      .classList.add("selected");
  }

  result.textContent =
    color === "red"
      ? "🔴 Red নির্বাচন করা হয়েছে"
      : "🔵 Blue নির্বাচন করা হয়েছে";
}

function spin(){

  if(spinning) return;

  if(!selectedColor){
    result.textContent = "⚠️ আগে Red অথবা Blue নির্বাচন করো";
    return;
  }

  const amount =
    parseInt(document.getElementById("amount").value);

  if(!amount || amount <= 0){
    result.textContent = "⚠️ সঠিক Demo Coin amount দাও";
    return;
  }

  if(amount > coins){
    result.textContent = "❌ পর্যাপ্ত Demo Coin নেই";
    return;
  }

  spinning = true;
  spinBtn.disabled = true;

  coins -= amount;
  updateCoins();

  result.textContent = "🎡 চাকা ঘুরছে...";

  /*
    Fair random result:
    0 = Red
    1 = Blue
  */
  const resultColor =
    Math.random() < 0.5 ? "red" : "blue";

  /*
    Red অংশ = 0-180°
    Blue অংশ = 180-360°
  */
  const extraSpins = 5 * 360;

  let targetAngle;

  if(resultColor === "red"){
    targetAngle = Math.floor(Math.random() * 170) + 5;
  }else{
    targetAngle = Math.floor(Math.random() * 170) + 185;
  }

  rotation += extraSpins + targetAngle;

  wheel.style.transform =
    `rotate(${rotation}deg)`;

  setTimeout(() => {

    if(resultColor === selectedColor){

      const winAmount = amount * 2;

      coins += winAmount;

      result.innerHTML =
        `🎉 জিতেছো! ${resultColor === "red" ? "🔴 RED" : "🔵 BLUE"} এসেছে<br>
         +${winAmount} Demo Coins`;

    }else{

      result.innerHTML =
        `😔 ফলাফল: ${
          resultColor === "red"
          ? "🔴 RED"
          : "🔵 BLUE"
        }<br>
        Demo Coin কাটা গেছে: ${amount}`;

    }

    updateCoins();

    spinning = false;
    spinBtn.disabled = false;

  },4000);
}

function updateCoins(){
  coinsText.textContent = coins;
}

</script>

</body>
</html>
