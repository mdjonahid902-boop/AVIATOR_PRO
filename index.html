<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gaming Zone Demo</title><style>*{box-sizing:border-box}body{margin:0;background:#080b12;color:#fff;font-family:Arial,sans-serif}header{height:82px;padding:10px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #202632;background:#0d1119}.brand{font-size:28px;font-weight:900;color:#ff8a00;margin-right:auto}.balance{padding:13px 18px;border:2px solid #314b26;border-radius:16px;background:#111823;font-weight:800}.bonus{padding:14px 22px;border:0;border-radius:16px;background:#3aa34a;color:white;font-weight:900}main{padding:32px 18px}.title{display:inline-block;padding:10px 28px;border-radius:0 22px 22px 0;background:linear-gradient(90deg,#ff5a36,#ff3c2d);font-size:21px;font-weight:900;margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px;max-width:950px}.card{padding:12px;border:2px solid #29313d;border-radius:26px;background:#10151f;box-shadow:0 10px 28px #0006;cursor:pointer;transition:.18s}.card:hover{transform:translateY(-4px)}.thumb{aspect-ratio:1;border-radius:20px;display:grid;place-items:center;background:linear-gradient(145deg,#4b061d,#8a0d2b);overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.emoji{font-size:68px}.name{font-size:18px;font-weight:900;margin:12px 2px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.play{width:100%;padding:10px;border:0;border-radius:12px;background:#232d3a;color:#fff;font-weight:900}.status{color:#9ba6b6;padding:20px 0}</style></head><body><header><div class="brand">GAMING ZONE</div><div class="balance">🪙 Demo Balance: 944.20</div><button class="bonus" onclick="alert('Demo only')">🎁 Bonus</button></header><main><div class="title">🎮 GAMES</div><div id="status" class="status">গেম লোড হচ্ছে...</div><div id="games" class="grid"></div></main><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getDatabase,ref,onValue}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js';
const firebaseConfig={apiKey:'AIzaSyAyTOnCm5IuPcB-yvGjFl3KbwRVxNrcNSY',authDomain:'ff-to-gaming-4ea1b.firebaseapp.com',databaseURL:'https://ff-to-gaming-4ea1b-default-rtdb.firebaseio.com',projectId:'ff-to-gaming-4ea1b',storageBucket:'ff-to-gaming-4ea1b.appspot.com',messagingSenderId:'816776130875',appId:'1:816776130875:web:ffc53da579b5142e89871e',measurementId:'G-3QVZW97NSR'};
const db=getDatabase(initializeApp(firebaseConfig));const el=document.getElementById('games'),status=document.getElementById('status');
onValue(ref(db,'games'),s=>{const d=s.val()||{};const games=Object.entries(d).map(([id,g])=>({id,...g})).filter(g=>g.enabled!==false);status.textContent=games.length?'':'এখন কোনো সক্রিয় গেম নেই।';el.innerHTML=games.map(g=>`<article class="card" onclick="openGame('${g.id}')"><div class="thumb">${g.image?`<img src="${esc(g.image)}">`:`<div class="emoji">${esc(g.icon||'🎮')}</div>`}</div><div class="name">${esc(g.name||'Untitled Game')}</div><button class="play">PLAY</button></article>`).join('')});
function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}window.openGame=id=>location.href='game.html?id='+encodeURIComponent(id);
</script></body></html>
